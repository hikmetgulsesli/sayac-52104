<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kinetic Counter</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#fffbff",
                        "secondary-fixed-dim": "#d0bcff",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#fffbff",
                        "primary-fixed": "#e1e0ff",
                        "tertiary": "#904900",
                        "tertiary-container": "#b55d00",
                        "on-secondary-fixed-variant": "#5516be",
                        "tertiary-fixed-dim": "#ffb783",
                        "secondary-container": "#8455ef",
                        "surface-tint": "#494bd6",
                        "on-primary-fixed": "#07006c",
                        "inverse-on-surface": "#ecf1ff",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#6063ee",
                        "on-primary": "#ffffff",
                        "surface-variant": "#d8e3fb",
                        "on-primary-container": "#fffbff",
                        "inverse-primary": "#c0c1ff",
                        "on-surface-variant": "#464554",
                        "surface-container-high": "#dee8ff",
                        "primary-fixed-dim": "#c0c1ff",
                        "on-background": "#111c2d",
                        "tertiary-fixed": "#ffdcc5",
                        "surface-container-low": "#f0f3ff",
                        "surface-bright": "#f9f9ff",
                        "on-error-container": "#93000a",
                        "secondary": "#6b38d4",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "on-secondary-fixed": "#23005c",
                        "on-error": "#ffffff",
                        "background": "#f9f9ff",
                        "on-surface": "#111c2d",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#cfdaf2",
                        "inverse-surface": "#263143",
                        "surface-container-highest": "#d8e3fb",
                        "outline-variant": "#c7c4d7",
                        "error": "#ba1a1a",
                        "outline": "#767586",
                        "primary": "#4648d4",
                        "on-tertiary-fixed-variant": "#703700",
                        "surface": "#f9f9ff",
                        "secondary-fixed": "#e9ddff",
                        "surface-container": "#e7eeff",
                        "on-tertiary-fixed": "#301400"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Space Grotesk", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: theme('colors.surface-container-low');
            color: theme('colors.on-surface');
        }
        /* Hide scrollbar for clean mobile look */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden pb-24">
<!-- TopAppBar (From JSON) -->
<header class="bg-surface/80 backdrop-blur-xl docked full-width top-0 sticky z-50 shadow-sm no-border tonal-shift bg-surface-container-low/50">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto">
<h1 class="text-2xl font-bold font-['Space_Grotesk'] text-indigo-600 tracking-tight hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
                Kinetic Counter
            </h1>
<div class="flex items-center gap-4 hidden">
<!-- Search bar hidden per JSON -->
</div>
<div class="flex items-center gap-2">
<button class="text-indigo-600 hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200 p-2 rounded-full">
<span class="material-symbols-outlined">light_mode</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-4 py-6 flex flex-col gap-6 max-w-md mx-auto w-full">
<!-- The Hero Counter (Kinetic Playground Style) -->
<section class="bg-surface-container-lowest rounded-[2.5rem] p-8 pt-10 flex flex-col items-center relative overflow-hidden tonal-layering">
<!-- Decorative background blur -->
<div class="absolute -top-10 -right-10 w-40 h-40 bg-primary-fixed opacity-50 blur-3xl rounded-full pointer-events-none"></div>
<span class="font-label text-sm text-on-surface-variant uppercase tracking-[0.2em] font-semibold mb-6 relative z-10">
                Mevcut Değer
            </span>
<div class="font-headline text-[6rem] font-extrabold text-on-surface leading-none tabular-nums tracking-tighter mb-12 relative z-10">
                042
            </div>
<!-- Primary Action Hero Button -->
<button class="w-36 h-36 rounded-full bg-gradient-to-b from-primary to-primary-container flex items-center justify-center shadow-[0_12px_40px_-10px_rgba(70,72,212,0.4)] active:scale-95 transition-transform duration-200 relative z-10 group">
<span class="material-symbols-outlined text-on-primary text-[4rem] group-active:scale-90 transition-transform duration-200" style="font-variation-settings: 'FILL' 1;">add</span>
</button>
</section>
<!-- Secondary Controls -->
<section class="grid grid-cols-2 gap-4">
<button class="bg-surface-container-highest rounded-2xl py-5 px-4 flex flex-col items-center justify-center gap-3 active:scale-95 transition-transform duration-200">
<div class="w-12 h-12 rounded-full bg-surface flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">remove</span>
</div>
<span class="font-body text-sm text-on-surface-variant font-medium">Azalt</span>
</button>
<button class="bg-surface-container-highest rounded-2xl py-5 px-4 flex flex-col items-center justify-center gap-3 active:scale-95 transition-transform duration-200">
<div class="w-12 h-12 rounded-full bg-surface flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">refresh</span>
</div>
<span class="font-body text-sm text-on-surface-variant font-medium">Sıfırla</span>
</button>
</section>
<!-- History List (Scrollable Area) -->
<section class="bg-surface-container-lowest rounded-[2rem] p-6 flex flex-col gap-5 mt-2 flex-1">
<h3 class="font-headline text-xl font-bold text-on-surface tracking-tight">Son İşlemler</h3>
<div class="flex flex-col gap-4 overflow-y-auto pr-2 pb-4">
<!-- History Item 1 -->
<div class="flex items-center justify-between bg-surface rounded-2xl p-4 transition-colors hover:bg-surface-variant">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-fixed-variant" style="font-variation-settings: 'FILL' 1;">add</span>
</div>
<div class="flex flex-col">
<span class="font-body text-sm font-semibold text-on-surface">Artırıldı</span>
<span class="font-body text-xs text-on-surface-variant mt-0.5">Bugün, 14:32</span>
</div>
</div>
<span class="font-headline text-lg font-bold text-primary tabular-nums">+1</span>
</div>
<!-- History Item 2 -->
<div class="flex items-center justify-between bg-surface rounded-2xl p-4 transition-colors hover:bg-surface-variant">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-fixed-variant" style="font-variation-settings: 'FILL' 1;">add</span>
</div>
<div class="flex flex-col">
<span class="font-body text-sm font-semibold text-on-surface">Artırıldı</span>
<span class="font-body text-xs text-on-surface-variant mt-0.5">Bugün, 14:31</span>
</div>
</div>
<span class="font-headline text-lg font-bold text-primary tabular-nums">+1</span>
</div>
<!-- History Item 3 -->
<div class="flex items-center justify-between bg-surface rounded-2xl p-4 transition-colors hover:bg-surface-variant">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-secondary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-fixed-variant" style="font-variation-settings: 'FILL' 1;">remove</span>
</div>
<div class="flex flex-col">
<span class="font-body text-sm font-semibold text-on-surface">Azaltıldı</span>
<span class="font-body text-xs text-on-surface-variant mt-0.5">Bugün, 12:15</span>
</div>
</div>
<span class="font-headline text-lg font-bold text-secondary tabular-nums">-1</span>
</div>
</div>
</section>
</main>
<!-- BottomNavBar (From JSON) -->
<nav class="bg-white/90 backdrop-blur-lg fixed bottom-0 w-full rounded-t-3xl lg:hidden no-border shadow-[0_-4px_20px_rgba(0,0,0,0.05)] shadow-2xl fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pt-3 pb-8">
<!-- Active Tab: Counter -->
<button class="flex flex-col items-center justify-center bg-indigo-100 text-indigo-700 rounded-2xl px-6 py-2 active:scale-90 transition-transform duration-150 active:bg-slate-100">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-['Inter'] text-[10px] font-medium">Counter</span>
</button>
<!-- Inactive Tab: History -->
<button class="flex flex-col items-center justify-center text-slate-400 px-6 py-2 active:scale-90 transition-transform duration-150 active:bg-slate-100">
<span class="material-symbols-outlined mb-1">history</span>
<span class="font-['Inter'] text-[10px] font-medium">History</span>
</button>
<!-- Inactive Tab: Settings -->
<button class="flex flex-col items-center justify-center text-slate-400 px-6 py-2 active:scale-90 transition-transform duration-150 active:bg-slate-100">
<span class="material-symbols-outlined mb-1">settings</span>
<span class="font-['Inter'] text-[10px] font-medium">Settings</span>
</button>
</nav>
</body></html>
